services:
  - type: web
    name: api-guardian-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AI_PROVIDER
        value: fallback
      - key: GENERATED_COLLECTIONS_DIR
        value: /tmp/generated
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        fromDatabase:
          name: api-guardian-db
          property: connectionString

databases:
  - name: api-guardian-db
    plan: free
